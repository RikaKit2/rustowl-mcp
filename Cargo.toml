[package]
name = "rustowl-mcp"
version = "0.1.0"
edition = "2021"
description = "Model Context Protocol server for RustOwl lifetime & borrow inspection"
authors = ["RikaKit2"]
license = "AGPL-3.0-or-later"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
